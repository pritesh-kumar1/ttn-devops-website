  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevOps Training</title>
    <style>

        margin: 0;
        min-height: 100vh;
        display: grid;

  <body>
    <main>
      <h1>DevOps Training</h1>
